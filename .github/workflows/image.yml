name: Image

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/u1f992/gs-wasm-devcontainer:${{ github.sha }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - run: docker build -t "$IMAGE" .

      - run: docker run --rm --user ubuntu --mount "type=bind,src=$PWD/test.sh,dst=/test.sh,ro" "$IMAGE" /test.sh

      - if: github.ref == 'refs/heads/main'
        run: docker push "$IMAGE"
